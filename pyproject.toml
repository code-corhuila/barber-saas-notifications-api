[project]
name = "barber-saas-notifications-api"
version = "0.1.0"
description = "Service of the notifications domain: the in-app inbox of each user and their device tokens"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pyjwt[crypto]>=2.9,<3",
    "pymongo>=4.9,<5",
    "google-auth[requests]>=2.30,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "import-linter>=2.1,<3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

# What replaces the compiler (05-architecture/hexagonal-architecture.md, "Python services"):
# the domain imports nothing of the project, the application only the domain, and neither
# imports FastAPI, a database driver or an adapter. A broken contract fails the pull request.
[tool.importlinter]
root_package = "notifications"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
    "notifications.adapter",
    "notifications.application",
    "notifications.domain",
]

[[tool.importlinter.contracts]]
name = "The core does not know the web, the database or the token library"
type = "forbidden"
source_modules = ["notifications.domain", "notifications.application"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "pymongo", "jwt", "uvicorn"]
